<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signInWithPopup,GoogleAuthProvider,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,sendPasswordResetEmail,sendEmailVerification}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

/* CONFIGURATION FIREBASE (valeurs publiques) */
var cfg={apiKey:"AIzaSyAG3fQkwhrfmklTiYRp1l9PYz-VL9AgYW4",authDomain:"bfamily-competences-zone.firebaseapp.com",projectId:"bfamily-competences-zone",storageBucket:"bfamily-competences-zone.firebasestorage.app",messagingSenderId:"839328126762",appId:"1:839328126762:web:094099073943d3e3ac7053"};
var app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),COURSE="Maîtriser le prompting IA";
window.FB={
google:function(){return signInWithPopup(auth,new GoogleAuthProvider())},
signup:async function(e,p){var c=await createUserWithEmailAndPassword(auth,e,p);try{await sendEmailVerification(c.user,{url:SITE+"#bienvenue"})}catch(x){}return c},
resend:async function(){if(auth.currentUser)await sendEmailVerification(auth.currentUser,{url:SITE+"#bienvenue"})},
check:async function(){var u=auth.currentUser;if(u){await u.reload();S.verified=u.emailVerified;render()}},
login:function(e,p){return signInWithEmailAndPassword(auth,e,p)},
reset:function(e){return sendPasswordResetEmail(auth,e)},
out:function(){S.sub="home";return signOut(auth)},
save:function(){if(!S.user)return;setDoc(doc(db,"users",S.user.uid),{name:S.name,done:S.done},{merge:true}).catch(function(){})},
verify:async function(id){var x=await getDoc(doc(db,"certificates",id));return x.exists()?x.data():null},
adm:async function(){var q=await getDocs(collection(db,"users")),u=[];q.forEach(function(d){u.push(d.data())});return u},
comments:async function(){var q=await getDocs(query(collection(db,"comments"),where("course","==","prompting"))),a=[];q.forEach(function(d){var x=d.data();x.id=d.id;a.push(x)});a.sort(function(x,y){return (y.createdAt||0)-(x.createdAt||0)});return a},
postcm:async function(r,t){await setDoc(doc(db,"comments","prompting_"+S.user.uid),{uid:S.user.uid,name:shortName(S.name),text:t,rating:r,course:"prompting",createdAt:Date.now()})},
delcm:async function(id){await deleteDoc(doc(db,"comments",id))},
issue:async function(){
if(S.issuing||S.certId||!S.user)return;S.issuing=true;
var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";
for(var t=0;t<5&&!S.certId;t++){
var b=crypto.getRandomValues(new Uint8Array(6)),r="";for(var i=0;i<6;i++)r+=A[b[i]%A.length];
var id="BF-"+new Date().getFullYear()+"-"+r,now=Date.now();
try{await setDoc(doc(db,"certificates",id),{uid:S.user.uid,name:S.name,course:COURSE,issuedAt:now});
S.certId=id;S.certDate=now;await setDoc(doc(db,"users",S.user.uid),{certId:id,certDate:now},{merge:true})}catch(e){}
}
if(!S.certId)S.certFail=true;
S.issuing=false;render()}
};
onAuthStateChanged(auth,async function(u){
if(!u){try{localStorage.removeItem("bf_in")}catch(e){}S.user=null;S.done=[];S.name="";S.certId=null;S.certDate=null;S.adm=null;S.admLoad=0;S.authReady=true;render();return}

try{var x=await getDoc(doc(db,"users",u.uid));
if(x.exists()){var d=x.data();S.name=d.name||u.displayName||"";S.done=d.done||[];S.certId=d.certId||null;S.certDate=d.certDate||null}
else{S.name=S.pendingName||u.displayName||"";S.done=[];S.certId=null;await setDoc(doc(db,"users",u.uid),{name:S.name,email:u.email||"",done:[],createdAt:Date.now()})}
}catch(e){S.err="Impossible de charger votre compte."}
if(!location.hash||location.hash=="#accueil")location.hash="cours";S.authReady=true;render()});
